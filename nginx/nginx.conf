# Edge reverse proxy: serves the React SPA and proxies API + admin to Django.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # Simple abuse protection in front of the login endpoint.
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
    limit_req_status 429;

    upstream backend_upstream {
        server backend:8000;
        keepalive 16;
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}
