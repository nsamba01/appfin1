# =============================================================================
# ICHESS Finance — plateforme de gestion financière et bancaire
# Démarrage :  docker compose build && docker compose up -d
# =============================================================================
name: finbank

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY est requis (voir .env)}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8080}
  DATABASE_URL: postgresql://${POSTGRES_USER:-finbank}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}@db:5432/${POSTGRES_DB:-finbank}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?FIELD_ENCRYPTION_KEY est requis (voir .env)}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-False}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
  JWT_REFRESH_MINUTES: ${JWT_REFRESH_MINUTES:-480}
  SESSION_COOKIE_AGE: ${SESSION_COOKIE_AGE:-3600}
  MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
  LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
  THROTTLE_LOGIN: ${THROTTLE_LOGIN:-20/min}
  TIME_ZONE: ${TIME_ZONE:-Africa/Kinshasa}
  APP_CURRENCY: ${APP_CURRENCY:-USD}
  APP_COMPANY_NAME: ${APP_COMPANY_NAME:-ICHESS Finance}
  ECOBANK_BASE_URL: ${ECOBANK_BASE_URL:-https://apimuat-gateway.ecobank.com}
  BANK_SYNC_INTERVAL_MINUTES: ${BANK_SYNC_INTERVAL_MINUTES:-30}
  BANK_SYNC_WORKER_ENABLED: ${BANK_SYNC_WORKER_ENABLED:-True}
  INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-}
  INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
  INITIAL_FINANCE_USERNAME: ${INITIAL_FINANCE_USERNAME:-}
  INITIAL_FINANCE_PASSWORD: ${INITIAL_FINANCE_PASSWORD:-}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — no published port: reachable only from the Docker network.
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finbank}
      POSTGRES_USER: ${POSTGRES_USER:-finbank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finbank} -d ${POSTGRES_DB:-finbank}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend_net

  # ---------------------------------------------------------------------------
  # Django / DRF backend (gunicorn). Applies migrations on start-up only once.
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
      WAIT_FOR_DB: "1"
      RUN_MIGRATIONS: "1"
      BOOTSTRAP_USERS: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4); sys.exit(0 if r.status==200 else 1)",
        ]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 60s
    networks:
      - backend_net

  # ---------------------------------------------------------------------------
  # Bank synchronisation worker (Ecobank). Never invents a balance.
  # ---------------------------------------------------------------------------
  bank-sync-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "manage.py", "run_bank_sync"]
    env_file:
      - .env
    environment:
      <<: *backend-env
      WAIT_FOR_DB: "1"
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - backend_net

  # ---------------------------------------------------------------------------
  # React SPA served by nginx (internal only; the edge proxy exposes it).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app_net

  # ---------------------------------------------------------------------------
  # Edge reverse proxy — the only service published to the host.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net
      - backend_net

  # ---------------------------------------------------------------------------
  # Automated PostgreSQL backups (pg_dump, 7-day rotation).
  # ---------------------------------------------------------------------------
  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-finbank}
      PGUSER: ${POSTGRES_USER:-finbank}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups
        echo "Service de sauvegarde actif (intervalle: $${BACKUP_INTERVAL_SECONDS}s)."
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          target="/backups/finbank_$${stamp}.dump"
          if pg_dump --format=custom --no-owner --no-privileges --file="$${target}"; then
            echo "Sauvegarde OK: $${target} ($$(du -h "$${target}" | cut -f1))"
          else
            echo "ECHEC de la sauvegarde a $${stamp}" >&2
            rm -f "$${target}"
          fi
          find /backups -name 'finbank_*.dump' -type f -mtime +$${BACKUP_RETENTION_DAYS} -delete || true
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    networks:
      - backend_net

  # ---------------------------------------------------------------------------
  # Test runner (opt-in): docker compose --profile test run --rm backend-test
  # ---------------------------------------------------------------------------
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    command: ["pytest", "-q"]
    environment:
      <<: *backend-env
      DJANGO_SETTINGS_MODULE: config.settings_test
      DJANGO_TESTING: "1"
      WAIT_FOR_DB: "0"
      RUN_MIGRATIONS: "0"
    networks:
      - backend_net

volumes:
  pgdata:
  staticfiles:
  media:
  nginx_logs:

networks:
  # Backend-only network: the SPA host cannot reach PostgreSQL directly.
  backend_net:
    driver: bridge
  # Front-end network: the browser-facing proxy and the SPA container.
  app_net:
    driver: bridge
